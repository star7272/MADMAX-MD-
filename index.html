<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADMAX-MD</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff1493;
            font-size: 42px;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #ff1493;
        }

        p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .madmax-btn {
            display: inline-block;
            padding: 16px 45px;
            background: #ff1493;
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            border: 2px solid #ff1493;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
            transition: 0.3s ease;
        }

        .madmax-btn:hover {
            background: #000;
            color: #ff1493;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.8);
            transform: scale(1.05);
        }

        .footer {
            margin-top: 30px;
            color: #555;
